<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <style>
      text { font-family: Helvetica; }
      .title { font-size: 34px; font-weight: 700; fill: #17191d; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #666b73; }
      .card-title { font-size: 22px; font-weight: 700; fill: #1d2025; }
      .card-copy { font-size: 15px; font-weight: 400; fill: #747983; }
      .label { font-size: 12px; font-weight: 700; fill: #8a9099; letter-spacing: 1.1px; }
      .menu-light { fill: #f0f0f1; }
      .menu-dark { fill: #292a2d; }
      .card { fill: #fff; stroke: #dfe2e7; stroke-width: 1; }
      .large-glyph { color: #24272c; }
      .meter-track { fill: currentColor; opacity: .22; }
      .meter-fill { fill: currentColor; }
    </style>

    <!-- Each symbol is authored on the app's native 24 × 18 pt canvas. -->
    <symbol id="meter" viewBox="0 0 7 18">
      <rect x="1" y="3" width="5" height="12" rx="2.5" class="meter-track"/>
      <rect x="1" y="8" width="5" height="7" rx="2.5" class="meter-fill"/>
    </symbol>

    <!-- A: Two profiles, with the negative-space overlap doing the switching work. -->
    <symbol id="overlap" viewBox="0 0 24 18">
      <circle cx="8" cy="6" r="3" fill="currentColor"/>
      <path d="M2.4 15c.2-3.5 2.1-5.4 5.6-5.4s5.4 1.9 5.6 5.4H2.4Z" fill="currentColor"/>
      <circle cx="15.5" cy="5.2" r="2.7" fill="currentColor"/>
      <path d="M10.4 14.6c.2-3.2 1.9-4.9 5.1-4.9s4.9 1.7 5.1 4.9H10.4Z" fill="currentColor"/>
      <path d="M11.7 3.8v11" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".92"/>
    </symbol>

    <!-- B: Two account cards with a crisp transfer chevron. -->
    <symbol id="cards" viewBox="0 0 24 18">
      <rect x="2.2" y="2.2" width="13.2" height="10" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="6.3" cy="6.3" r="1.6" fill="currentColor"/>
      <path d="M4 10c.1-1.7.9-2.5 2.3-2.5s2.2.8 2.3 2.5H4Z" fill="currentColor"/>
      <path d="M6.5 15.6h12.2a2.6 2.6 0 0 0 2.6-2.6V6.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="m18.3 4.8 3-1.8v3.6l-3-1.8Z" fill="currentColor"/>
    </symbol>

    <!-- C: Circular switching motion around two distinct accounts. -->
    <symbol id="orbit" viewBox="0 0 24 18">
      <circle cx="8" cy="9" r="3.1" fill="currentColor"/>
      <circle cx="16" cy="9" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5.2 4.6A8.2 8.2 0 0 1 18 3.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="m17.2 1.7 3.6 2.2-3.6 2V1.7Z" fill="currentColor"/>
      <path d="M18.8 13.4A8.2 8.2 0 0 1 6 14.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="m6.8 16.3-3.6-2.2 3.6-2v4.2Z" fill="currentColor"/>
    </symbol>

    <!-- D: A single split identity badge, the most compact option. -->
    <symbol id="split" viewBox="0 0 24 18">
      <circle cx="12" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 2v14" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="8.8" cy="7" r="1.8" fill="currentColor"/>
      <path d="M5.8 12.8c.1-2 1.1-3.1 3-3.1s2.9 1.1 3 3.1h-6Z" fill="currentColor"/>
      <circle cx="15.2" cy="7" r="1.8" fill="currentColor"/>
      <path d="M12.2 12.8c.1-2 1.1-3.1 3-3.1s2.9 1.1 3 3.1h-6Z" fill="currentColor"/>
    </symbol>

    <!-- E: Two account slots; the center arrows read clearly at one-to-one size. -->
    <symbol id="slots" viewBox="0 0 24 18">
      <rect x="2.2" y="3" width="6.3" height="12" rx="3.15" fill="currentColor"/>
      <rect x="15.5" y="3" width="6.3" height="12" rx="3.15" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8.8 6.2h5.3l-1.6-1.6M15.2 11.8H9.9l1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- F: A small keyring shared by two account nodes. -->
    <symbol id="keyring" viewBox="0 0 24 18">
      <circle cx="6" cy="6" r="2.6" fill="currentColor"/>
      <path d="M1.8 14c.1-3 1.5-4.7 4.2-4.7s4.1 1.7 4.2 4.7H1.8Z" fill="currentColor"/>
      <circle cx="14" cy="6" r="2.6" fill="currentColor"/>
      <path d="M9.8 14c.1-3 1.5-4.7 4.2-4.7s4.1 1.7 4.2 4.7H9.8Z" fill="currentColor"/>
      <circle cx="19" cy="9.5" r="2.3" fill="#fff" stroke="currentColor" stroke-width="1.6"/>
      <path d="M20.7 11.2 23 13.5m-1.2-1.2 1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1440" height="1120" fill="#f7f8fa"/>
  <text x="72" y="74" class="title">Mac menu-bar icon directions</text>
  <text x="72" y="107" class="subtitle">Six template-safe alternatives, shown at native size and enlarged. The quota meter remains a stable companion.</text>

  <!-- Shared helper: each card contains a 24×18 icon enlarged 8×, then two native menu-bar specimens. -->

  <g transform="translate(72 150)">
    <rect width="408" height="420" rx="24" class="card"/>
    <text x="28" y="42" class="label">A · RECOMMENDED</text>
    <text x="28" y="76" class="card-title">Overlap</text>
    <text x="28" y="102" class="card-copy">Fastest read for “multiple accounts.”</text>
    <g transform="translate(108 125) scale(8)" class="large-glyph"><use xlink:href="#overlap" width="24" height="18"/></g>
    <text x="28" y="300" class="label">IN CONTEXT · 1×</text>
    <rect x="28" y="320" width="168" height="56" rx="13" class="menu-light"/>
    <g transform="translate(78 339)" style="color:#191a1c"><use xlink:href="#overlap" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
    <rect x="212" y="320" width="168" height="56" rx="13" class="menu-dark"/>
    <g transform="translate(262 339)" style="color:#f5f5f6"><use xlink:href="#overlap" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
  </g>

  <g transform="translate(516 150)">
    <rect width="408" height="420" rx="24" class="card"/>
    <text x="28" y="42" class="label">B · EXPLICIT</text>
    <text x="28" y="76" class="card-title">Account cards</text>
    <text x="28" y="102" class="card-copy">Most literal “profiles transfer” story.</text>
    <g transform="translate(108 125) scale(8)" class="large-glyph"><use xlink:href="#cards" width="24" height="18"/></g>
    <text x="28" y="300" class="label">IN CONTEXT · 1×</text>
    <rect x="28" y="320" width="168" height="56" rx="13" class="menu-light"/>
    <g transform="translate(78 339)" style="color:#191a1c"><use xlink:href="#cards" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
    <rect x="212" y="320" width="168" height="56" rx="13" class="menu-dark"/>
    <g transform="translate(262 339)" style="color:#f5f5f6"><use xlink:href="#cards" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
  </g>

  <g transform="translate(960 150)">
    <rect width="408" height="420" rx="24" class="card"/>
    <text x="28" y="42" class="label">C · DYNAMIC</text>
    <text x="28" y="76" class="card-title">Account orbit</text>
    <text x="28" y="102" class="card-copy">Strong switching cue; slightly busier.</text>
    <g transform="translate(108 125) scale(8)" class="large-glyph"><use xlink:href="#orbit" width="24" height="18"/></g>
    <text x="28" y="300" class="label">IN CONTEXT · 1×</text>
    <rect x="28" y="320" width="168" height="56" rx="13" class="menu-light"/>
    <g transform="translate(78 339)" style="color:#191a1c"><use xlink:href="#orbit" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
    <rect x="212" y="320" width="168" height="56" rx="13" class="menu-dark"/>
    <g transform="translate(262 339)" style="color:#f5f5f6"><use xlink:href="#orbit" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
  </g>

  <g transform="translate(72 606)">
    <rect width="408" height="420" rx="24" class="card"/>
    <text x="28" y="42" class="label">D · COMPACT</text>
    <text x="28" y="76" class="card-title">Split identity</text>
    <text x="28" y="102" class="card-copy">Quietest silhouette; reads as a badge.</text>
    <g transform="translate(108 125) scale(8)" class="large-glyph"><use xlink:href="#split" width="24" height="18"/></g>
    <text x="28" y="300" class="label">IN CONTEXT · 1×</text>
    <rect x="28" y="320" width="168" height="56" rx="13" class="menu-light"/>
    <g transform="translate(78 339)" style="color:#191a1c"><use xlink:href="#split" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
    <rect x="212" y="320" width="168" height="56" rx="13" class="menu-dark"/>
    <g transform="translate(262 339)" style="color:#f5f5f6"><use xlink:href="#split" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
  </g>

  <g transform="translate(516 606)">
    <rect width="408" height="420" rx="24" class="card"/>
    <text x="28" y="42" class="label">E · SYSTEMATIC</text>
    <text x="28" y="76" class="card-title">Account slots</text>
    <text x="28" y="102" class="card-copy">Clear active/inactive and bidirectional switch.</text>
    <g transform="translate(108 125) scale(8)" class="large-glyph"><use xlink:href="#slots" width="24" height="18"/></g>
    <text x="28" y="300" class="label">IN CONTEXT · 1×</text>
    <rect x="28" y="320" width="168" height="56" rx="13" class="menu-light"/>
    <g transform="translate(78 339)" style="color:#191a1c"><use xlink:href="#slots" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
    <rect x="212" y="320" width="168" height="56" rx="13" class="menu-dark"/>
    <g transform="translate(262 339)" style="color:#f5f5f6"><use xlink:href="#slots" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
  </g>

  <g transform="translate(960 606)">
    <rect width="408" height="420" rx="24" class="card"/>
    <text x="28" y="42" class="label">F · CREDENTIALS</text>
    <text x="28" y="76" class="card-title">Shared keyring</text>
    <text x="28" y="102" class="card-copy">Closest evolution of the current concept.</text>
    <g transform="translate(108 125) scale(8)" class="large-glyph"><use xlink:href="#keyring" width="24" height="18"/></g>
    <text x="28" y="300" class="label">IN CONTEXT · 1×</text>
    <rect x="28" y="320" width="168" height="56" rx="13" class="menu-light"/>
    <g transform="translate(78 339)" style="color:#191a1c"><use xlink:href="#keyring" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
    <rect x="212" y="320" width="168" height="56" rx="13" class="menu-dark"/>
    <g transform="translate(262 339)" style="color:#f5f5f6"><use xlink:href="#keyring" width="24" height="18"/><use xlink:href="#meter" x="29" width="7" height="18"/></g>
  </g>

  <text x="72" y="1080" class="subtitle">Design constraint: solid template tint only; no color dependency. Native glyph canvas 24 × 18 pt, metered width 36 pt.</text>
</svg>
